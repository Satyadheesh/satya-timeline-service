name: Runner check

# Setup check: checkout, Python compile, and write access.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}/.ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-core
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Compile
        run: |
          python -m compileall -q . > /dev/null && echo "compiled OK"
          python -c "import linecache; print('quiet tracebacks:', 'on' if linecache.getline('/etc/hostname', 1) == '' else 'OFF')"
      - name: Write check
        run: |
          rm -rf /tmp/m && mkdir /tmp/m && cd /tmp/m && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${CORE_TOKEN}@github.com/${GITHUB_REPOSITORY}-core.git"
          git checkout -q --orphan runner-check
          echo "run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" > ok.txt
          git add ok.txt && git commit -qm "runner check ${GITHUB_RUN_ID}" && git push -q -f origin HEAD:runner-check
          echo "write OK"
